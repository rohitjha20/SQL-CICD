name: 🔌 Test Azure SQL Connection

on:
  workflow_dispatch:

jobs:
  test-connection:
    name: 🧪 Test Connectivity
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login (Client Secret)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}    # ← JSON from az ad sp create-for-rbac

      - name: 🔑 Get Secrets from Key Vault
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: ${{ secrets.AZURE_KEYVAULT_NAME }}
          secrets: 'sql-connection-string-uat, sql-connection-string-prod'
        id: kv

      - name: Install SqlPackage
        run: |
          dotnet tool install --global microsoft.sqlpackage
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: ✅ Test UAT
        run: |
          sqlpackage /Action:Version \
            /TargetConnectionString:"${{ steps.kv.outputs.sql-connection-string-uat }}"
          echo "UAT Connected ✅"

      - name: ✅ Test Prod
        run: |
          sqlpackage /Action:Version \
            /TargetConnectionString:"${{ steps.kv.outputs.sql-connection-string-prod }}"
          echo "Prod Connected ✅"

      - name: Azure Logout
        if: always()
        run: az logout
