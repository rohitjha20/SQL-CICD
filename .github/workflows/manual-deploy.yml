name: 🛠️ Manual Schema Deployment (Admin)

# ─────────────────────────────────────────────────────────────
# PURPOSE:
#   Generate a deployment SQL script for admins to download and
#   execute manually. Supports schema swapping for UAT and Prod.
#
# HOW IT WORKS:
#   1. Admin triggers this workflow manually
#   2. Picks target schema (uat, cmd, arl, etc.)
#   3. Picks target environment (UAT DB or Prod DB)
#   4. Workflow replaces [dbo] with the chosen schema
#   5. Builds the DACPAC and generates a SQL script
#   6. Admin downloads the script and executes it
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      target_schema:
        description: 'Target schema name (e.g., uat, cmd, arl)'
        required: true
        type: choice
        options:
          - uat
          - cmd
          - arl
        # ↑ Add more schemas here as needed

      target_environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - UAT
          - Prod

      dry_run:
        description: 'Dry run — generate script only, do NOT deploy'
        required: true
        type: boolean
        default: true

concurrency:
  group: manual-deploy-${{ github.event.inputs.target_environment }}-${{ github.event.inputs.target_schema }}
  cancel-in-progress: false    # Don't cancel manual admin deploys

jobs:
  # ─── 1. BUILD WITH SCHEMA REPLACEMENT ─────────────────────────
  build:
    name: 🔨 Build DACPAC [${{ inputs.target_schema }}]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SQL Project Template
        run: dotnet new install Microsoft.Build.Sql.Templates

      - name: 🔄 Replace [dbo] with [${{ inputs.target_schema }}]
        run: |
          echo "Replacing [dbo] → [${{ inputs.target_schema }}] in all SQL files..."

          find dbo/ PostDeployment/ -name "*.sql" -type f | while read file; do
            sed -i "s/\[dbo\]/[${{ inputs.target_schema }}]/g" "$file"
            echo "  ✔ $file"
          done

          echo ""
          echo "Schema replacement complete."
          echo "Sample verification:"
          head -5 dbo/Tables/EmployeeDummy.sql

      - name: Build SQL Project
        run: dotnet build cicd.sqlproj --configuration Release

      - name: 📦 Upload DACPAC
        uses: actions/upload-artifact@v4
        with:
          name: dacpac-${{ inputs.target_schema }}-${{ inputs.target_environment }}
          path: bin/Release/cicd.dacpac
          retention-days: 30

  # ─── 2. GENERATE SCRIPT & OPTIONALLY DEPLOY ──────────────────
  deploy:
    name: 📋 Generate Script [${{ inputs.target_schema }} → ${{ inputs.target_environment }}]
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}

    steps:
      - name: 📥 Download DACPAC
        uses: actions/download-artifact@v4
        with:
          name: dacpac-${{ inputs.target_schema }}-${{ inputs.target_environment }}

      - name: Install SqlPackage
        run: |
          dotnet tool install --global microsoft.sqlpackage
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: 📋 Generate Deployment Script (Preview)
        run: |
          echo "Generating deployment script for [${{ inputs.target_schema }}] on ${{ inputs.target_environment }}..."

          CONNECTION_STRING="${{ inputs.target_environment == 'UAT' && secrets.SQL_CONNECTION_STRING_UAT || secrets.SQL_CONNECTION_STRING_PROD }}"

          sqlpackage \
            /Action:Script \
            /SourceFile:"./cicd.dacpac" \
            /TargetConnectionString:"$CONNECTION_STRING" \
            /OutputPath:"./deploy_${{ inputs.target_schema }}_${{ inputs.target_environment }}.sql" \
            /p:DropObjectsNotInSource=False \
            /p:BlockOnPossibleDataLoss=True \
            /p:GenerateSmartDefaults=True

          echo ""
          echo "═══════════════════════════════════════════"
          echo "  Script generated successfully"
          echo "  Schema:      ${{ inputs.target_schema }}"
          echo "  Environment: ${{ inputs.target_environment }}"
          echo "═══════════════════════════════════════════"
          echo ""
          echo "--- Script Preview (first 50 lines) ---"
          head -50 deploy_${{ inputs.target_schema }}_${{ inputs.target_environment }}.sql

      - name: 📦 Upload Deployment Script
        uses: actions/upload-artifact@v4
        with:
          name: deploy-script-${{ inputs.target_schema }}-${{ inputs.target_environment }}
          path: deploy_${{ inputs.target_schema }}_${{ inputs.target_environment }}.sql
          retention-days: 30

      - name: 🚀 Execute Deployment (if not dry run)
        if: inputs.dry_run == false
        run: |
          echo "🚀 Deploying [${{ inputs.target_schema }}] to ${{ inputs.target_environment }}..."

          CONNECTION_STRING="${{ inputs.target_environment == 'UAT' && secrets.SQL_CONNECTION_STRING_UAT || secrets.SQL_CONNECTION_STRING_PROD }}"

          sqlpackage \
            /Action:Publish \
            /SourceFile:"./cicd.dacpac" \
            /TargetConnectionString:"$CONNECTION_STRING" \
            /p:DropObjectsNotInSource=False \
            /p:BlockOnPossibleDataLoss=True \
            /p:GenerateSmartDefaults=True

          echo "Deployment complete ✅"

      - name: 📝 Deployment Summary
        if: always()
        run: |
          echo "╔══════════════════════════════════════════════╗"
          echo "║         Manual Deployment Summary             ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  Schema:       ${{ inputs.target_schema }}"
          echo "║  Environment:  ${{ inputs.target_environment }}"
          echo "║  Dry Run:      ${{ inputs.dry_run }}"
          echo "║  Artifact:     deploy-script-${{ inputs.target_schema }}-${{ inputs.target_environment }}"
          echo "╚══════════════════════════════════════════════╝"
          echo ""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "📥 Download the SQL script from Artifacts and execute manually."
          else
            echo "✅ Deployment was executed automatically."
          fi
