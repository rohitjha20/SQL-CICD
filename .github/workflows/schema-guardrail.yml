name: 🛡️ Schema Guardrail — Environment Alignment Check

# Validates that SQL schema references match the folder AND branch.
#
# FOLDER RULES (always enforced):
#   UAT/  folder → Only [uat] schema allowed
#   Prod/ folder → Only production schemas allowed ([roh], [moh], [cmd], [arl])
#
# BRANCH RULES (additional check):
#   PR → dev  : Prod/ folder changes are flagged as WARNING
#   PR → main : UAT/ folder changes are flagged as WARNING
#
# No database connection — pure file scan.

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - '**/*.sql'

jobs:
  schema-guardrail:
    name: 🛡️ Schema Alignment Check
    runs-on: ubuntu-latest

    env:
      # ── Allowed schemas per folder ──
      # Update PROD_SCHEMAS when new production schemas are added
      UAT_SCHEMAS: "uat"
      PROD_SCHEMAS: "roh,moh,cmd,arl"
      # System schemas — always allowed everywhere
      SYSTEM_SCHEMAS: "dbo,sys,INFORMATION_SCHEMA"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📋 Identify Changed SQL Files
        id: changed
        run: |
          CHANGED_SQL=$(git diff --name-only --diff-filter=ACMR \
            ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            -- '*.sql' | grep -v '.github/' || true)

          if [ -z "$CHANGED_SQL" ]; then
            echo "ℹ️  No SQL files changed in this PR"
            echo "has_sql=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_sql=true" >> $GITHUB_OUTPUT
          echo "$CHANGED_SQL" > /tmp/changed_sql_files.txt

          echo "═══════════════════════════════════════════════"
          echo "  Changed SQL Files in PR"
          echo "═══════════════════════════════════════════════"
          echo "$CHANGED_SQL" | while read f; do
            echo "  📄 $f"
          done

      - name: 🔍 Check Folder ↔ Schema Alignment
        if: steps.changed.outputs.has_sql == 'true'
        id: check
        run: |
          TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
          VIOLATIONS=0
          WARNINGS=0
          CHECKED=0

          echo "═══════════════════════════════════════════════"
          echo "  Target Branch: $TARGET_BRANCH"
          echo "═══════════════════════════════════════════════"
          echo ""

          # Build forbidden patterns
          # For UAT/ folder: production schemas are forbidden
          PROD_PATTERN=$(echo "$PROD_SCHEMAS" | tr ',' '\n' | sed 's/.*$/\\[&\\]/' | tr '\n' '|' | sed 's/|$//')
          # For Prod/ folder: uat schema is forbidden
          UAT_PATTERN=$(echo "$UAT_SCHEMAS" | tr ',' '\n' | sed 's/.*$/\\[&\\]/' | tr '\n' '|' | sed 's/|$//')

          while IFS= read -r file; do
            [ -f "$file" ] || continue
            CHECKED=$((CHECKED + 1))

            # ── Determine which folder this file belongs to ──
            FOLDER=""
            if echo "$file" | grep -qiE "^UAT/"; then
              FOLDER="UAT"
              FORBIDDEN_PATTERN="$PROD_PATTERN"
              ALLOWED="$UAT_SCHEMAS"
              FORBIDDEN="$PROD_SCHEMAS"
            elif echo "$file" | grep -qiE "^Prod/"; then
              FOLDER="PROD"
              FORBIDDEN_PATTERN="$UAT_PATTERN"
              ALLOWED="$PROD_SCHEMAS"
              FORBIDDEN="$UAT_SCHEMAS"
            elif echo "$file" | grep -qiE "^dbup/"; then
              FOLDER="DBUP"
              # DbUp migrations use [uat] as source — check based on branch
              if [ "$TARGET_BRANCH" = "main" ]; then
                FORBIDDEN_PATTERN="$UAT_PATTERN"
                ALLOWED="$PROD_SCHEMAS"
                FORBIDDEN="$UAT_SCHEMAS"
              else
                FORBIDDEN_PATTERN="$PROD_PATTERN"
                ALLOWED="$UAT_SCHEMAS"
                FORBIDDEN="$PROD_SCHEMAS"
              fi
            else
              echo "ℹ️  SKIP: $file (not in UAT/ or Prod/ folder)"
              continue
            fi

            # ── Check for forbidden schema references ──
            FOUND=$(grep -niE "$FORBIDDEN_PATTERN" "$file" 2>/dev/null || true)

            if [ -n "$FOUND" ]; then
              VIOLATIONS=$((VIOLATIONS + 1))
              echo "❌ VIOLATION [$FOLDER]: $file"
              echo "   Expected: [$ALLOWED]"
              echo "   Found forbidden schema:"
              echo "$FOUND" | while IFS= read -r line; do
                echo "      ⚠️  $line"
              done
              echo ""
            else
              echo "✅ OK [$FOLDER]: $file"
            fi

            # ── Branch alignment warning ──
            if [ "$TARGET_BRANCH" = "main" ] && echo "$file" | grep -qiE "^UAT/"; then
              WARNINGS=$((WARNINGS + 1))
              echo "   ⚠️  WARNING: UAT/ file modified in PR targeting production (main)"
            fi
            if [ "$TARGET_BRANCH" = "dev" ] && echo "$file" | grep -qiE "^Prod/"; then
              WARNINGS=$((WARNINGS + 1))
              echo "   ⚠️  WARNING: Prod/ file modified in PR targeting UAT (dev)"
            fi

          done < /tmp/changed_sql_files.txt

          echo ""
          echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
          echo "checked=$CHECKED" >> $GITHUB_OUTPUT

      - name: 🛡️ Enforce Guardrail
        if: steps.changed.outputs.has_sql == 'true'
        run: |
          VIOLATIONS="${{ steps.check.outputs.violations }}"
          WARNINGS="${{ steps.check.outputs.warnings }}"
          CHECKED="${{ steps.check.outputs.checked }}"
          TARGET="${{ github.event.pull_request.base.ref }}"

          echo ""
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║  ❌  SCHEMA GUARDRAIL FAILED                               ║"
            echo "╠══════════════════════════════════════════════════════════════╣"
            echo "║  Target branch:  $TARGET"
            echo "║  Files checked:  $CHECKED"
            echo "║  Violations:     $VIOLATIONS"
            echo "║  Warnings:       $WARNINGS"
            echo "╠══════════════════════════════════════════════════════════════╣"
            echo "║                                                            ║"
            echo "║  RULES:                                                    ║"
            echo "║  • UAT/ folder  → Only [uat] schema allowed               ║"
            echo "║  • Prod/ folder → Only [roh],[moh],[cmd],[arl] allowed     ║"
            echo "║                                                            ║"
            echo "║  FIX:                                                      ║"
            echo "║  Check the violations above and replace the schema         ║"
            echo "║  references to match the folder's environment.             ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            exit 1
          else
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║  ✅  SCHEMA GUARDRAIL PASSED                               ║"
            echo "╠══════════════════════════════════════════════════════════════╣"
            echo "║  Target branch:  $TARGET"
            echo "║  Files checked:  $CHECKED"
            echo "║  Violations:     0"
            echo "║  Warnings:       $WARNINGS"
            echo "╚══════════════════════════════════════════════════════════════╝"

            if [ "$WARNINGS" -gt 0 ]; then
              echo ""
              echo "⚠️  $WARNINGS warning(s) — review the logs above."
              echo "   Warnings don't block the PR but indicate possible"
              echo "   cross-environment file changes."
            fi
          fi
