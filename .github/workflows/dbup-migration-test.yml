name: 🔄 DbUp Migration Test (Throwaway SQL Server)

on:
  # ── Auto-trigger: fires after PR merge to main ──
  push:
    branches:
      - main
    paths:
      - 'dbup/**'

  # ── Manual trigger: admin picks schema from dropdown ──
  workflow_dispatch:
    inputs:
      target_schema:
        description: 'Target schema to swap [uat] to'
        required: true
        type: choice
        options:
          - uat
          - cmd
          - arl
          - roh

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1: Build & validate (runs on EVERY push/merge)
  # ═══════════════════════════════════════════════════════════
  build-validate:
    name: 🔨 Build & Validate DbUp Runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🔨 Build DbUp Runner
        run: |
          cd dbup/runner
          dotnet restore
          dotnet build --configuration Release
          echo "✅ DbUp runner compiled successfully"

      - name: 📋 List Migration Scripts
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Migration Scripts in Repository"
          echo "═══════════════════════════════════════════════"
          for f in dbup/migrations/*.sql; do
            echo "  📄 $(basename "$f")"
          done
          echo ""
          echo "Total: $(ls dbup/migrations/*.sql | wc -l) scripts"

  # ═══════════════════════════════════════════════════════════
  # JOB 2: Deploy to selected schema (manual trigger only)
  #   - On workflow_dispatch: uses dropdown selection
  #   - On push (PR merge): runs all schemas in parallel
  # ═══════════════════════════════════════════════════════════
  detect-schemas:
    name: 📋 Determine Target Schemas
    needs: build-validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      trigger: ${{ steps.set-matrix.outputs.trigger }}
    steps:
      - name: Set Schema Matrix
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger — use the dropdown selection
            SCHEMA="${{ github.event.inputs.target_schema }}"
            echo "matrix={\"schema\":[\"$SCHEMA\"]}" >> $GITHUB_OUTPUT
            echo "trigger=manual" >> $GITHUB_OUTPUT
            echo "🎯 Manual trigger → schema: [$SCHEMA]"
          else
            # PR merge — test ALL schemas in parallel
            echo 'matrix={"schema":["uat","cmd","arl","roh"]}' >> $GITHUB_OUTPUT
            echo "trigger=auto" >> $GITHUB_OUTPUT
            echo "🔀 PR merge → testing ALL schemas: [uat, cmd, arl, roh]"
          fi

  dbup-test:
    name: "🧪 DbUp → [${{ matrix.schema }}]"
    needs: detect-schemas
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-schemas.outputs.matrix) }}

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStrong!Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SOURCE_SCHEMA: uat
      TARGET_SCHEMA: ${{ matrix.schema }}
      CONNECTION_STRING: "Server=localhost,1433;Database=TestDB;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🔌 Wait for SQL Server
        run: |
          echo "Waiting for SQL Server container..."
          for i in $(seq 1 30); do
            if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q "SELECT 1" &>/dev/null; then
              echo "✅ SQL Server is ready"
              break
            fi
            echo "  Attempt $i/30 — waiting..."
            sleep 2
          done

      - name: 🗄️ Create TestDB
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C \
            -Q "CREATE DATABASE [TestDB];"
          echo "✅ TestDB created"

      - name: "🔄 Swap schema: [uat] → [${{ env.TARGET_SCHEMA }}]"
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Swapping [$SOURCE_SCHEMA] → [$TARGET_SCHEMA]"
          echo "═══════════════════════════════════════════════"

          if [ "$SOURCE_SCHEMA" != "$TARGET_SCHEMA" ]; then
            find dbup/migrations/ -name "*.sql" \
              -exec sed -i "s/\[${SOURCE_SCHEMA}\]/\[${TARGET_SCHEMA}\]/g" {} +
            echo "✅ Schema swapped in all migration files"
          else
            echo "ℹ️  Source = Target ($SOURCE_SCHEMA), no swap needed"
          fi

          echo ""
          echo "── Migration files after swap ──"
          for f in dbup/migrations/*.sql; do
            echo "📄 $(basename $f):"
            head -3 "$f"
            echo "---"
          done

      - name: 🔨 Build DbUp Runner
        run: |
          cd dbup/runner
          dotnet restore
          dotnet build --configuration Release
          echo "✅ DbUp runner compiled"

      - name: "🚀 Run DbUp Migrations → [${{ env.TARGET_SCHEMA }}]"
        run: |
          cd dbup/runner
          dotnet run --configuration Release -- \
            "$CONNECTION_STRING" \
            "../migrations"

      - name: 📊 Verify Migration Results
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Verification: Schema [$TARGET_SCHEMA]"
          echo "═══════════════════════════════════════════════"

          echo ""
          echo "── SchemaVersions (DbUp tracking table) ──"
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -d TestDB \
            -Q "SELECT ScriptName, Applied FROM SchemaVersions ORDER BY Applied;"

          echo ""
          echo "── Tables created under [$TARGET_SCHEMA] ──"
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -d TestDB \
            -Q "SELECT TABLE_SCHEMA, TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA = '$TARGET_SCHEMA' ORDER BY TABLE_NAME;"

          echo ""
          echo "── Columns in [$TARGET_SCHEMA].[Customers] ──"
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -d TestDB \
            -Q "SELECT COLUMN_NAME, DATA_TYPE, CHARACTER_MAXIMUM_LENGTH FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA = '$TARGET_SCHEMA' AND TABLE_NAME = 'Customers' ORDER BY ORDINAL_POSITION;"

          echo ""
          echo "── Seeded data in [$TARGET_SCHEMA].[Customers] ──"
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -d TestDB \
            -Q "SELECT * FROM [$TARGET_SCHEMA].[Customers];"

      - name: 🔁 Re-run DbUp (should skip all — idempotent)
        run: |
          cd dbup/runner
          dotnet run --configuration Release -- \
            "$CONNECTION_STRING" \
            "../migrations"

  # ═══════════════════════════════════════════════════════════
  # JOB 3: Summary
  # ═══════════════════════════════════════════════════════════
  summary:
    name: 📊 Results
    needs: [detect-schemas, dbup-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║         DbUp Migration Test — Final Report          ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  Trigger:   ${{ needs.detect-schemas.outputs.trigger }}"
          echo "║  Schemas:   ${{ needs.detect-schemas.outputs.matrix }}"
          echo "║  Result:    ${{ needs.dbup-test.result }}"
          echo "║  Live DB:   ❌ NOT used (throwaway container only)  ║"
          echo "╠══════════════════════════════════════════════════════╣"
          if [ "${{ needs.detect-schemas.outputs.trigger }}" = "auto" ]; then
            echo "║  ℹ️  This was triggered by PR merge.                ║"
            echo "║  To deploy a specific schema, go to:               ║"
            echo "║  Actions → 🔄 DbUp Migration Test → Run workflow  ║"
            echo "║  and select the target schema from the dropdown.   ║"
          else
            echo "║  ✅ Manual deployment for selected schema complete ║"
          fi
          echo "╚══════════════════════════════════════════════════════╝"

          if [ "${{ needs.dbup-test.result }}" != "success" ]; then
            exit 1
          fi
