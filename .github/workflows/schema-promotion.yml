name: 🔄 Schema Promotion — [dbo] → [roh] (Dry Run)

# Triggers on PR from uat branch to main
on:
  pull_request:
    branches:
      - main
    paths:
      - 'dbo/**'
      - 'PostDeployment/**'

jobs:
  dry-run:
    name: 🧪 Dry Run — Replace [dbo] → [roh] & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SQL Project Template
        run: dotnet new install Microsoft.Build.Sql.Templates

      - name: 🔄 Replace [dbo] → [roh] in all SQL files
        run: |
          echo "══════════════════════════════════════════"
          echo "  Schema Replacement: [dbo] → [roh]"
          echo "══════════════════════════════════════════"

          find dbo/ PostDeployment/ -name "*.sql" -type f | while read file; do
            sed -i "s/\[dbo\]/[roh]/g" "$file"
            echo "  ✔ $file"
          done

          echo ""
          echo "── Verification ──"
          echo "Files still containing [dbo]:"
          grep -rl "\[dbo\]" dbo/ PostDeployment/ || echo "  None ✅"

      - name: 📝 Create Schema Definition
        run: |
          mkdir -p Security
          echo "CREATE SCHEMA [roh] AUTHORIZATION [dbo];" > Security/roh.sql
          echo "GO" >> Security/roh.sql
          echo "Created Security/roh.sql ✅"

      - name: 📝 Generate .sqlproj
        run: |
          cat << 'EOF' > cicd.sqlproj
          <?xml version="1.0" encoding="utf-8"?>
          <Project DefaultTargets="Build">
            <Sdk Name="Microsoft.Build.Sql" Version="2.2.0" />
            <PropertyGroup>
              <Name>cicd</Name>
              <DSP>Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider</DSP>
              <ModelCollation>1033, CI</ModelCollation>
              <TargetFramework>netstandard2.1</TargetFramework>
              <SqlServerVersion>SqlAzureV12</SqlServerVersion>
            </PropertyGroup>
            <ItemGroup>
              <Build Remove=".github/**/*.sql" />
              <Build Remove="cicd/**/*.sql" />
              <Build Remove="iteration-2/**/*.sql" />
              <Build Remove="PostDeployment/**/*.sql" />
              <Build Remove="cleanup_appdb.sql" />
              <Build Remove="tests/**/*.sql" />
              <PostDeploy Include="PostDeployment/PostDeployment.sql" />
            </ItemGroup>
            <Target Name="BeforeBuild">
              <Delete Files="$(BaseIntermediateOutputPath)/project.assets.json" />
            </Target>
          </Project>
          EOF

      - name: 🔨 Build DACPAC (Validate Schema)
        run: dotnet build cicd.sqlproj --configuration Release

      - name: 📋 Show Changed SQL (Preview)
        run: |
          echo "══════════════════════════════════════════"
          echo "  SQL Files After Schema Replacement"
          echo "══════════════════════════════════════════"

          for file in $(find dbo/ Security/ -name "*.sql" -type f | sort); do
            echo ""
            echo "── $file ──"
            cat "$file"
          done

      - name: ✅ Dry Run Summary
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║           DRY RUN COMPLETE ✅                 ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  Schema replaced: [dbo] → [roh]              ║"
          echo "║  DACPAC build:    Passed                      ║"
          echo "║  No deployment executed                       ║"
          echo "╚══════════════════════════════════════════════╝"
