name: 🔄 Schema Promotion (Dry Run — No Deployment)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'dbo/**'
      - 'PostDeployment/**'

  workflow_dispatch:
    inputs:
      target_schema:
        description: 'Target schema to validate'
        required: true
        type: choice
        options:
          - roh
          - cmd
          - arl

jobs:
  # ─── Build UAT schema ────────────────────────────────────────
  build-uat:
    name: 🧪 Build [uat] Schema
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SQL Project Template
        run: dotnet new install Microsoft.Build.Sql.Templates

      - name: 🗑️ Remove iteration-2
        run: rm -rf iteration-2/

      - name: 🔄 Replace [dbo] → [uat]
        run: |
          find dbo/ PostDeployment/ -name "*.sql" -type f | while read file; do
            sed -i "s/\[dbo\]/[uat]/g" "$file"
          done
          echo "Schema replaced: [dbo] → [uat] ✅"

      - name: 📝 Create Schema Definition
        run: |
          mkdir -p Security
          cat > Security/uat.sql << 'SQL'
          CREATE SCHEMA [uat] AUTHORIZATION [dbo];
          GO
          SQL

      - name: 📝 Generate .sqlproj
        run: |
          cat > cicd.sqlproj << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<Project DefaultTargets="Build">
  <Sdk Name="Microsoft.Build.Sql" Version="2.2.0" />
  <PropertyGroup>
    <Name>cicd</Name>
    <DSP>Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider</DSP>
    <ModelCollation>1033, CI</ModelCollation>
    <TargetFramework>netstandard2.1</TargetFramework>
    <SqlServerVersion>SqlAzureV12</SqlServerVersion>
  </PropertyGroup>
  <ItemGroup>
    <Build Remove=".github/**/*.sql" />
    <Build Remove="PostDeployment/**/*.sql" />
    <Build Remove="cleanup_appdb.sql" />
    <Build Remove="tests/**/*.sql" />
    <PostDeploy Include="PostDeployment/PostDeployment.sql" />
  </ItemGroup>
  <Target Name="BeforeBuild">
    <Delete Files="$(BaseIntermediateOutputPath)/project.assets.json" />
  </Target>
</Project>
EOF

      - name: 🔨 Build DACPAC [uat]
        run: dotnet build cicd.sqlproj --configuration Release

      - name: 📋 Preview [uat] SQL
        run: |
          echo "═══ Tables ═══"
          for f in dbo/Tables/*.sql; do echo "── $f ──"; head -3 "$f"; echo; done

      - name: ✅ UAT Build Passed
        run: echo "DACPAC build for [uat] schema passed ✅ — No deployment."

  # ─── Build ROH schema ────────────────────────────────────────
  build-roh:
    name: 🧪 Build [roh] Schema
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SQL Project Template
        run: dotnet new install Microsoft.Build.Sql.Templates

      - name: 🗑️ Remove iteration-2
        run: rm -rf iteration-2/

      - name: 🔄 Replace [dbo] → [roh]
        run: |
          find dbo/ PostDeployment/ -name "*.sql" -type f | while read file; do
            sed -i "s/\[dbo\]/[roh]/g" "$file"
          done
          echo "Schema replaced: [dbo] → [roh] ✅"

      - name: 📝 Create Schema Definition
        run: |
          mkdir -p Security
          cat > Security/roh.sql << 'SQL'
          CREATE SCHEMA [roh] AUTHORIZATION [dbo];
          GO
          SQL

      - name: 📝 Generate .sqlproj
        run: |
          cat > cicd.sqlproj << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<Project DefaultTargets="Build">
  <Sdk Name="Microsoft.Build.Sql" Version="2.2.0" />
  <PropertyGroup>
    <Name>cicd</Name>
    <DSP>Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider</DSP>
    <ModelCollation>1033, CI</ModelCollation>
    <TargetFramework>netstandard2.1</TargetFramework>
    <SqlServerVersion>SqlAzureV12</SqlServerVersion>
  </PropertyGroup>
  <ItemGroup>
    <Build Remove=".github/**/*.sql" />
    <Build Remove="PostDeployment/**/*.sql" />
    <Build Remove="cleanup_appdb.sql" />
    <Build Remove="tests/**/*.sql" />
    <PostDeploy Include="PostDeployment/PostDeployment.sql" />
  </ItemGroup>
  <Target Name="BeforeBuild">
    <Delete Files="$(BaseIntermediateOutputPath)/project.assets.json" />
  </Target>
</Project>
EOF

      - name: 🔨 Build DACPAC [roh]
        run: dotnet build cicd.sqlproj --configuration Release

      - name: 📋 Preview [roh] SQL
        run: |
          echo "═══ Tables ═══"
          for f in dbo/Tables/*.sql; do echo "── $f ──"; head -3 "$f"; echo; done

      - name: ✅ ROH Build Passed
        run: echo "DACPAC build for [roh] schema passed ✅ — No deployment."

  # ─── Summary ─────────────────────────────────────────────────
  summary:
    name: 📊 Dry Run Summary
    needs: [build-uat, build-roh]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📊 Results
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║        SCHEMA PROMOTION DRY RUN RESULTS          ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║  [uat] build: ${{ needs.build-uat.result }}"
          echo "║  [roh] build: ${{ needs.build-roh.result }}"
          echo "║                                                  ║"
          echo "║  ⚠️  NO deployment to any database               ║"
          echo "║  ⚠️  Build validation only                       ║"
          echo "╚══════════════════════════════════════════════════╝"
