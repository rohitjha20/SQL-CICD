name: 🔄 Schema Promotion (Dry Run)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'dbo/**'
      - 'PostDeployment/**'

  # Manual trigger with schema dropdown
  workflow_dispatch:
    inputs:
      target_schema:
        description: 'Target schema to promote to'
        required: true
        type: choice
        options:
          - roh
          - cmd
          - arl
          # ↑ Add more schemas here

jobs:
  dry-run:
    name: 🧪 Dry Run — [dbo] → [${{ inputs.target_schema || 'roh' }}]
    runs-on: ubuntu-latest

    env:
      TARGET_SCHEMA: ${{ inputs.target_schema || 'roh' }}    # Default to 'roh' for PR triggers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SQL Project Template
        run: dotnet new install Microsoft.Build.Sql.Templates

      - name: 🔄 Replace [dbo] → [${{ env.TARGET_SCHEMA }}]
        run: |
          echo "══════════════════════════════════════════"
          echo "  Schema Replacement: [dbo] → [$TARGET_SCHEMA]"
          echo "══════════════════════════════════════════"

          find dbo/ PostDeployment/ -name "*.sql" -type f | while read file; do
            sed -i "s/\[dbo\]/[$TARGET_SCHEMA]/g" "$file"
            echo "  ✔ $file"
          done

          echo ""
          echo "Files still containing [dbo]:"
          grep -rl "\[dbo\]" dbo/ PostDeployment/ || echo "  None ✅"

      - name: 🗑️ Remove iteration-2 (avoid duplicates)
        run: rm -rf iteration-2/

      - name: 📝 Create Schema Definition
        run: |
          mkdir -p Security
          echo "CREATE SCHEMA [$TARGET_SCHEMA] AUTHORIZATION [dbo];" > Security/$TARGET_SCHEMA.sql
          echo "GO" >> Security/$TARGET_SCHEMA.sql
          echo "Created Security/$TARGET_SCHEMA.sql ✅"

      - name: 📝 Generate .sqlproj
        run: |
          cat << 'EOF' > cicd.sqlproj
<?xml version="1.0" encoding="utf-8"?>
<Project DefaultTargets="Build">
  <Sdk Name="Microsoft.Build.Sql" Version="2.2.0" />
  <PropertyGroup>
    <Name>cicd</Name>
    <DSP>Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider</DSP>
    <ModelCollation>1033, CI</ModelCollation>
    <TargetFramework>netstandard2.1</TargetFramework>
    <SqlServerVersion>SqlAzureV12</SqlServerVersion>
  </PropertyGroup>
  <ItemGroup>
    <Build Remove=".github/**/*.sql" />
    <Build Remove="PostDeployment/**/*.sql" />
    <Build Remove="cleanup_appdb.sql" />
    <Build Remove="tests/**/*.sql" />
    <PostDeploy Include="PostDeployment/PostDeployment.sql" />
  </ItemGroup>
  <Target Name="BeforeBuild">
    <Delete Files="$(BaseIntermediateOutputPath)/project.assets.json" />
  </Target>
</Project>
EOF

      - name: 🔨 Build DACPAC (Validate Schema)
        run: dotnet build cicd.sqlproj --configuration Release

      - name: 📋 Show Changed SQL (Preview)
        run: |
          echo "══════════════════════════════════════════"
          echo "  SQL Files — Schema: [$TARGET_SCHEMA]"
          echo "══════════════════════════════════════════"

          for file in $(find dbo/ Security/ -name "*.sql" -type f | sort); do
            echo ""
            echo "── $file ──"
            cat "$file"
          done

      - name: ✅ Dry Run Summary
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║           DRY RUN COMPLETE ✅                 ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  Schema replaced: [dbo] → [$TARGET_SCHEMA]   ║"
          echo "║  DACPAC build:    Passed                      ║"
          echo "║  No deployment executed                       ║"
          echo "╚══════════════════════════════════════════════╝"
